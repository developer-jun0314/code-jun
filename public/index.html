<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Jun - 개발자 맞춤형 스마트 AI</title>
    <!-- 마크다운 파서 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js (토쿄 나이트 다크 테마) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* ==========================================================================
           Code Jun 독자적 반응형 시스템 및 디자인 테마
           ========================================================================== */
        :root {
            font-size: clamp(13px, 0.75vw + 0.4vh + 0.2vmin, 17px);

            --spacing-xs: clamp(0.2rem, 0.4vmin, 0.4rem);
            --spacing-sm: clamp(0.4rem, 0.8vmin, 0.75rem);
            --spacing-md: clamp(0.75rem, 1.5vmin, 1.2rem);
            --spacing-lg: clamp(1.2rem, 2.2vmin, 1.8rem);

            --sidebar-width: clamp(260px, 75vw, 310px);
            --header-height: clamp(48px, 6.5vh, 60px);
            --chat-max-width: min(780px, 92vw);

            /* Code Jun Signature Theme (Cyber Purple & Dark Indigo) */
            --bg-dark: #0a0c10;
            --bg-sidebar: #12151e;
            --bg-input: #181c28;
            --bg-card-hover: #222738;
            --border-color: rgba(99, 102, 241, 0.18);
            --accent-glow: #6366f1;
            --accent-purple: #8b5cf6;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Vector Icon Base */
        .svg-icon {
            width: clamp(16px, 1.1rem, 20px);
            height: clamp(16px, 1.1rem, 20px);
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        /* ==========================================================================
           Sidebar Layout
           ========================================================================== */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100dvh;
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #sidebar.open {
            transform: translateX(0);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .code-jun-logo-badge {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .code-jun-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(32px, 2.2rem, 38px);
            height: clamp(32px, 2.2rem, 38px);
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-purple));
            border-radius: 10px;
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -1px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .brand-title {
            font-weight: 700;
            font-size: clamp(0.95rem, 1em, 1.1rem);
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: var(--spacing-xs);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .icon-btn:hover { background-color: var(--bg-card-hover); color: #fff; }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            width: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            color: var(--text-main);
            padding: clamp(9px, 1.3vh, 13px) var(--spacing-md);
            border-radius: 12px;
            font-size: clamp(0.88rem, 0.95em, 1.02rem);
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
            cursor: pointer;
            margin-bottom: var(--spacing-md);
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(139, 92, 246, 0.28));
            border-color: var(--accent-glow);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 4px; list-style: none; }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(8px, 1.2vh, 12px) var(--spacing-sm);
            border-radius: 10px;
            font-size: clamp(0.85rem, 0.92em, 1rem);
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .sidebar-item-left { display: flex; align-items: center; gap: var(--spacing-md); }
        .sidebar-item:hover { background-color: var(--bg-card-hover); }

        /* 최근 채팅 기록 영역 */
        .recent-section-header {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-xs) var(--spacing-sm);
            font-size: clamp(0.72rem, 0.78em, 0.85rem);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .recent-chat-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            list-style: none;
            overflow-y: auto;
            max-height: clamp(140px, 25vh, 260px);
            margin-top: 4px;
        }

        .recent-chat-item {
            padding: clamp(7px, 1vh, 10px) var(--spacing-sm);
            border-radius: 8px;
            font-size: clamp(0.82rem, 0.88em, 0.95rem);
            color: #cbd5e1;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s, color 0.15s;
        }
        .recent-chat-item:hover { background-color: var(--bg-card-hover); color: #fff; }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .login-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            background: none;
            border: none;
            color: var(--text-main);
            font-size: clamp(0.85rem, 0.9em, 1rem);
            font-weight: 600;
            cursor: pointer;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 8px;
            transition: background 0.2s;
            width: 100%;
        }
        .login-btn:hover { background-color: var(--bg-card-hover); }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 998;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #overlay.show { display: block; opacity: 1; }

        /* ==========================================================================
           Main Content Layout
           ========================================================================== */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-dark);
            height: 100dvh;
            width: 100%;
        }

        #top-bar {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-md);
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-behavior: smooth;
        }
        #chat-box.chat-active { justify-content: flex-start; }

        .home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: var(--chat-max-width);
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-title {
            font-size: clamp(1.2rem, 1.8vw + 0.9vh, 1.75rem);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: clamp(1.2rem, 2.5vh, 2.2rem);
            text-align: center;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 독자적 글래스모피즘 메인 입력 바 */
        .chat-input-bar {
            width: 100%;
            background: var(--bg-input);
            border-radius: 20px;
            padding: clamp(6px, 1vh, 10px) var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }
        .chat-input-bar:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .plus-btn {
            width: clamp(28px, 2rem, 34px);
            height: clamp(28px, 2rem, 34px);
            border-radius: 10px;
            background-color: var(--bg-card-hover);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .plus-btn:hover { background-color: #2d3448; color: var(--accent-glow); }

        .main-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: clamp(0.88rem, 0.95em, 1.02rem);
            padding: 6px 0;
        }
        .main-input::placeholder { color: var(--text-muted); }

        .input-actions-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .mic-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .mic-btn:hover { background-color: var(--bg-card-hover); color: var(--text-main); }

        /* 동적 애니메이션 버튼 */
        .waveform-btn {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-purple));
            color: #fff;
            width: clamp(32px, 2.3rem, 38px);
            height: clamp(32px, 2.3rem, 38px);
            border-radius: 12px;
            border: none;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .waveform-btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(99, 102, 241, 0.55); }

        /* 애니메이션용 아이콘 전환 효과 */
        .action-icon-anim {
            animation: iconPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes iconPop {
            0% { transform: scale(0.4) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 중지 버튼 스타일 강조 */
        .waveform-btn.stop-mode {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
        }

        /* 추천 질문 카드 */
        .recommend-questions-list {
            width: 100%;
            margin-top: clamp(0.8rem, 1.8vh, 1.3rem);
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 10px);
        }

        .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 1.3vh, 14px) var(--spacing-md);
            background-color: rgba(24, 28, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            color: var(--text-main);
            font-size: clamp(0.82rem, 0.9em, 0.98rem);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .recommend-item:hover {
            background-color: var(--bg-input);
            border-color: var(--border-color);
            transform: translateY(-1px);
        }
        .recommend-left { display: flex; align-items: center; gap: var(--spacing-md); }
        .recommend-left .svg-icon { color: var(--accent-glow); }

        /* 메시지 영역 */
        .msg-container { width: 100%; max-width: var(--chat-max-width); display: flex; flex-direction: column; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
        .msg-wrapper { width: 100%; display: flex; align-items: flex-start; gap: var(--spacing-md); animation: msgFade 0.25s ease forwards; }

        @keyframes msgFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.user { justify-content: flex-end; }

        .chat-avatar {
            width: clamp(28px, 1.9rem, 34px);
            height: clamp(28px, 1.9rem, 34px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: clamp(0.7rem, 0.8em, 0.9rem);
            font-weight: 700;
        }
        .user-avatar { background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); }
        .ai-avatar { background: linear-gradient(135deg, var(--accent-glow), var(--accent-purple)); color: #fff; box-shadow: 0 0 10px rgba(99, 102, 241, 0.4); }

        .message {
            line-height: 1.65;
            font-size: clamp(0.85rem, 0.95em, 1.02rem);
            max-width: calc(100% - 48px);
            word-break: break-word;
        }
        .user-msg {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 16px;
            white-space: pre-wrap;
        }
        .ai-msg { color: #f1f5f9; width: 100%; }

        .ai-msg h1, .ai-msg h2, .ai-msg h3 { margin: var(--spacing-md) 0 var(--spacing-xs) 0; font-weight: 600; color: #fff; }
        .ai-msg p { margin-bottom: var(--spacing-sm); }
        .ai-msg code:not(pre code) {
            background-color: var(--bg-input);
            color: #a78bfa;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .code-block-wrapper {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: var(--spacing-md) 0;
            overflow: hidden;
        }
        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #161b22;
            padding: var(--spacing-xs) var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .code-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 0.72rem; display: flex; align-items: center; gap: 4px;
        }
        .code-btn:hover { color: var(--text-main); }
        .code-block-wrapper pre { padding: var(--spacing-md); overflow-x: auto; margin: 0; }

        #file-input { display: none; }

        #preview-chip {
            display: none;
            align-items: center;
            gap: 6px;
            background-color: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            margin-bottom: 4px;
            width: fit-content;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleSidebar()"></div>

    <input type="file" id="file-input" onchange="handleFileSelect(event)">

    <!-- 독자적 스타일의 사이드바 -->
    <aside id="sidebar">
        <div>
            <div class="sidebar-top">
                <div class="code-jun-logo-badge">
                    <div class="code-jun-logo">&lt;/&gt;</div>
                    <span class="brand-title">Code Jun</span>
                </div>
                <button class="icon-btn" onclick="toggleSidebar()" title="닫기">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <button class="new-chat-btn" onclick="resetToHome()">
                <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                새 채팅 시작
            </button>

            <!-- 필수 메뉴 목록 -->
            <ul class="sidebar-menu">
                <li>
                    <a href="#" class="sidebar-item">
                        <div class="sidebar-item-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            라이브러리
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="sidebar-item">
                        <div class="sidebar-item-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                            플러그인
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="sidebar-item">
                        <div class="sidebar-item-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                            프로젝트
                        </div>
                        <svg class="svg-icon" style="width: 14px; height: 14px; color: var(--text-muted);" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </a>
                </li>
            </ul>

            <!-- 최근 채팅 기록 -->
            <div class="recent-section-header">최근 기록</div>
            <ul id="recent-chat-list" class="recent-chat-list">
                <!-- 사용자 질문 기록이 자동 추가됨 -->
            </ul>
        </div>

        <div class="sidebar-footer">
            <button class="login-btn" onclick="alert('로그인 기능 준비 중입니다.')">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                로그인
            </button>
        </div>
    </aside>

    <!-- 메인 영역 -->
    <main id="main-content">
        <header id="top-bar">
            <button class="icon-btn" onclick="toggleSidebar()" title="메뉴 열기">
                <svg class="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <button class="icon-btn" onclick="resetToHome()" title="새 채팅">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
        </header>

        <div id="chat-box">
            <div id="welcome-view" class="home-view">
                <h1 id="dynamic-greeting" class="home-title">오늘은 무슨 코딩을 할까요?</h1>
                
                <!-- 메인 입력 바 -->
                <div class="chat-input-bar">
                    <button class="plus-btn" onclick="triggerFileUpload()" title="코드/파일 첨부">
                        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <div id="preview-chip">
                            <span id="chip-filename"></span>
                            <span style="cursor:pointer;" onclick="removeFile()">✕</span>
                        </div>
                        <input type="text" id="user-input" class="main-input" placeholder="코드 문제, 버그, 알고리즘에 대해 물어보세요" oninput="updateActionButtonState()" onkeypress="handleEnter(event)">
                    </div>

                    <div class="input-actions-right">
                        <button class="mic-btn" title="음성 입력">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        </button>
                        <!-- 상태별 자동 전환 버튼 (음성파형 / 비행기 / 중지) -->
                        <button id="action-btn" class="waveform-btn" onclick="handleSendButton()" title="음성 모드">
                            <svg id="action-icon" class="svg-icon action-icon-anim" viewBox="0 0 24 24">
                                <line x1="12" y1="2" x2="12" y2="22"></line>
                                <line x1="17" y1="5" x2="17" y2="19"></line>
                                <line x1="7" y1="9" x2="7" y2="15"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 추천 질문 목록 -->
                <div class="recommend-questions-list">
                    <div class="recommend-item" onclick="sendQuickQuestion('React 컴포넌트 성능 최적화 방법 알려줘')">
                        <div class="recommend-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            <span>React 컴포넌트 성능 최적화 방법</span>
                        </div>
                        <svg class="svg-icon" style="color: var(--text-muted); width: 14px;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>

                    <div class="recommend-item" onclick="sendQuickQuestion('파이썬으로 비동기 크롤러 만드는 예제 코드 작성해줘')">
                        <div class="recommend-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            <span>파이썬 비동기 웹 크롤러 작성 예제</span>
                        </div>
                        <svg class="svg-icon" style="color: var(--text-muted); width: 14px;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>

                    <div class="recommend-item" onclick="sendQuickQuestion('TypeScript의 Generic 개념과 사용 이유 설명해줘')">
                        <div class="recommend-left">
                            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            <span>TypeScript Generic 개념 및 사용법</span>
                        </div>
                        <svg class="svg-icon" style="color: var(--text-muted); width: 14px;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
    let isChatStarted = false;
    let attachedFile = null;
    let isGenerating = false;
    let abortController = null;
    let recentChats = [];
    let currentButtonState = "waveform"; // waveform, send, stop

    // SVG 아이콘 템플릿
    const ICON_WAVEFORM = `<line x1="12" y1="2" x2="12" y2="22"></line><line x1="17" y1="5" x2="17" y2="19"></line><line x1="7" y1="9" x2="7" y2="15"></line>`;
    const ICON_SEND = `<line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>`;
    const ICON_STOP = `<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>`;

    const greetings = [
        "오늘은 무슨 코딩을 할까요?",
        "어떤 코드 문제나 프로젝트를 도와드릴까요?",
        "새로운 아이디어나 해결할 버그가 있으신가요?",
        "Code Jun과 함께 스마트한 개발을 시작해보세요.",
        "무엇이든 물어보세요, 깔끔한 코드로 답해드릴게요!"
    ];

    document.addEventListener("DOMContentLoaded", () => {
        setRandomGreeting();
        updateActionButtonState();
    });

    function setRandomGreeting() {
        const greetingEl = document.getElementById("dynamic-greeting");
        if (greetingEl) {
            const randomIndex = Math.floor(Math.random() * greetings.length);
            greetingEl.innerText = greetings[randomIndex];
        }
    }

    /* 실시간 입력 및 상태 변화에 따라 아이콘 전환 애니메이션 처리 */
    function updateActionButtonState() {
        const actionBtn = document.getElementById("action-btn");
        const actionIcon = document.getElementById("action-icon");
        const inputField = document.getElementById("user-input");
        if (!actionBtn || !actionIcon) return;

        const text = inputField ? inputField.value.trim() : "";
        let targetState = "waveform";

        if (isGenerating) {
            targetState = "stop";
        } else if (text.length > 0 || attachedFile !== null) {
            targetState = "send";
        } else {
            targetState = "waveform";
        }

        if (currentButtonState === targetState) return;
        currentButtonState = targetState;

        // 애니메이션 효과 적용을 위한 클래스 재적용
        actionIcon.classList.remove("action-icon-anim");
        void actionIcon.offsetWidth; // DOM reflow 트리거

        if (targetState === "stop") {
            actionIcon.innerHTML = ICON_STOP;
            actionBtn.classList.add("stop-mode");
            actionBtn.title = "답장 중지";
        } else if (targetState === "send") {
            actionIcon.innerHTML = ICON_SEND;
            actionBtn.classList.remove("stop-mode");
            actionBtn.title = "전송하기";
        } else {
            actionIcon.innerHTML = ICON_WAVEFORM;
            actionBtn.classList.remove("stop-mode");
            actionBtn.title = "음성 입력 모드";
        }

        actionIcon.classList.add("action-icon-anim");
    }

    // Marked 마크다운 파서 및 Highlight.js 세팅
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
        const lang = language || 'code';
        return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>${lang}</span>
                    <button class="code-btn" onclick="copyCode(this)">복사</button>
                </div>
                <pre><code class="hljs language-${lang}">${code}</code></pre>
            </div>
        `;
    };
    marked.setOptions({ renderer: renderer, breaks: true });

    function copyCode(btn) {
        const wrapper = btn.closest('.code-block-wrapper');
        const codeText = wrapper.querySelector('code').innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            btn.innerText = "완료";
            setTimeout(() => { btn.innerText = "복사"; }, 2000);
        });
    }

    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
    }

    function resetToHome() {
        if (isGenerating && abortController) abortController.abort();
        location.reload();
    }

    function triggerFileUpload() { document.getElementById("file-input").click(); }
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            attachedFile = file;
            const chip = document.getElementById("preview-chip");
            if(chip) {
                chip.style.display = "inline-flex";
                document.getElementById("chip-filename").innerText = file.name;
            }
            updateActionButtonState();
        }
    }
    function removeFile() {
        attachedFile = null;
        document.getElementById("file-input").value = "";
        const chip = document.getElementById("preview-chip");
        if(chip) chip.style.display = "none";
        updateActionButtonState();
    }

    function sendQuickQuestion(questionText) {
        const input = document.getElementById("user-input");
        if(input) input.value = questionText;
        updateActionButtonState();
        sendMessage();
    }

    function handleSendButton() {
        if (isGenerating) {
            // 답장 중지 실행
            if (abortController) abortController.abort();
            isGenerating = false;
            updateActionButtonState();
        } else {
            sendMessage();
        }
    }

    // 최근 채팅 기록 추가
    function addRecentChat(titleText) {
        recentChats.unshift(titleText);
        const recentList = document.getElementById("recent-chat-list");
        if (!recentList) return;

        const li = document.createElement("li");
        li.className = "recent-chat-item";
        li.innerText = titleText;
        li.onclick = () => {
            alert(`'${titleText}' 기록을 불러옵니다.`);
            toggleSidebar();
        };

        recentList.prepend(li);
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        if (!inputField) return;
        const message = inputField.value.trim();
        if (message === "" && !attachedFile) return;

        const chatBox = document.getElementById("chat-box");

        if (!isChatStarted) {
            addRecentChat(message || (attachedFile ? attachedFile.name : "새 질문"));
            isChatStarted = true;
            chatBox.classList.add("chat-active");
            chatBox.innerHTML = `
                <div id="msg-container" class="msg-container"></div>
                <div style="width: 100%; max-width: var(--chat-max-width); margin-top: auto; padding-top: var(--spacing-xs);">
                    <div class="chat-input-bar">
                        <button class="plus-btn" onclick="triggerFileUpload()">
                            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <div id="preview-chip">
                                <span id="chip-filename"></span>
                                <span style="cursor:pointer;" onclick="removeFile()">✕</span>
                            </div>
                            <input type="text" id="user-input" class="main-input" placeholder="메시지 입력..." oninput="updateActionButtonState()" onkeypress="handleEnter(event)">
                        </div>
                        <div class="input-actions-right">
                            <button id="action-btn" class="waveform-btn" onclick="handleSendButton()" title="음성 모드">
                                <svg id="action-icon" class="svg-icon action-icon-anim" viewBox="0 0 24 24">
                                    <line x1="12" y1="2" x2="12" y2="22"></line>
                                    <line x1="17" y1="5" x2="17" y2="19"></line>
                                    <line x1="7" y1="9" x2="7" y2="15"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        const msgContainer = document.getElementById("msg-container");
        let displayMsg = message;
        if (attachedFile) displayMsg = `[첨부: ${attachedFile.name}]\n` + message;

        appendMessage(displayMsg, "user", msgContainer);
        removeFile();
        inputField.value = "";

        const thinkingId = "thinking-" + Date.now();
        appendMessage(`답변 생성 중...`, "ai", msgContainer, thinkingId);

        isGenerating = true;
        updateActionButtonState();
        abortController = new AbortController();

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: [{ role: "user", content: displayMsg }] }),
                signal: abortController.signal
            });

            const data = await response.json();
            document.getElementById(thinkingId)?.remove();

            if (!response.ok) {
                appendMessage(`[오류] ${data.error || "처리 실패"}`, "ai", msgContainer);
                return;
            }

            if (data.reply) {
                appendMessage(data.reply, "ai", msgContainer);
            }
        } catch (error) {
            document.getElementById(thinkingId)?.remove();
            if (error.name === 'AbortError') {
                appendMessage(`답변 작성이 중지되었습니다.`, "ai", msgContainer);
            } else {
                appendMessage(`[시스템 오류] ${error.message}`, "ai", msgContainer);
            }
        } finally {
            isGenerating = false;
            abortController = null;
            updateActionButtonState();
        }
    }

    function appendMessage(text, sender, container, id = null) {
        const wrapper = document.createElement("div");
        wrapper.className = `msg-wrapper ${sender}`;
        if (id) wrapper.id = id;

        const avatar = document.createElement("div");
        avatar.className = `chat-avatar ${sender}-avatar`;
        avatar.innerHTML = sender === 'ai' ? `&lt;/&gt;` : `준`;

        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-msg`;

        if (sender === 'ai') {
            msgDiv.innerHTML = marked.parse(String(text));
            msgDiv.querySelectorAll('pre code').forEach((block) => {
                try { hljs.highlightElement(block); } catch(e){}
            });
        } else {
            msgDiv.innerHTML = String(text).replace(/\n/g, "<br>");
        }

        if (sender === 'ai') {
            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
        } else {
            wrapper.appendChild(msgDiv);
            wrapper.appendChild(avatar);
        }

        container.appendChild(wrapper);
        const chatBox = document.getElementById("chat-box");
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    function handleEnter(event) { if (event.key === "Enter") handleSendButton(); }
</script>
</body>
</html>
