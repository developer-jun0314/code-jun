<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Jun - 코딩 전문 AI</title>
    <!-- 마크다운 파서 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js CDN (어두운 테마) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* ==========================================================================
           기기 화면 비율 및 해상도 대응 유동적 반응형 시스템 (Fluid Responsive System)
           ========================================================================== */
        :root {
            /* 루트 폰트 사이즈: 뷰포트 너비/높이 및 화면 비율(vmin)에 비례하여 동적 스케일링 */
            font-size: clamp(13px, 0.85vw + 0.5vh + 0.3vmin, 18px);

            /* 스케일 가능 간격 및 패딩 */
            --spacing-xs: clamp(0.25rem, 0.5vmin, 0.5rem);
            --spacing-sm: clamp(0.5rem, 1vmin, 0.85rem);
            --spacing-md: clamp(0.85rem, 1.8vmin, 1.25rem);
            --spacing-lg: clamp(1.25rem, 2.5vmin, 2rem);

            /* 반응형 레이아웃 치수 */
            --sidebar-width: clamp(220px, 20vw, 290px);
            --header-height: clamp(50px, 7vh, 68px);
            --chat-max-width: min(850px, 92vw);

            /* Color Palette */
            --bg-dark: #09090b;
            --bg-sidebar: #121215;
            --bg-card: #18181b;
            --bg-hover: #27272a;
            --border-color: #27272a;
            --accent-color: #8b5cf6;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            font-size: 1rem; /* 루트 폰트 기준 수용 */
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* SVG Vector Icons - 반응형 사이즈 */
        .svg-icon {
            width: clamp(16px, 1.2rem, 22px);
            height: clamp(16px, 1.2rem, 22px);
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        /* ==========================================================================
           Sidebar (사이드바)
           ========================================================================== */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-lg);
            padding: 0 var(--spacing-xs);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: clamp(0.95rem, 1.1em, 1.3rem);
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: clamp(22px, 2rem, 30px);
            height: clamp(22px, 2rem, 30px);
            background: linear-gradient(135deg, #a78bfa, #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: var(--spacing-xs);
            border-radius: 6px;
            display: none;
            transition: background 0.2s, color 0.2s;
        }
        .close-sidebar-btn:hover { background-color: var(--bg-hover); color: #fff; }

        .sidebar-menu { display: flex; flex-direction: column; gap: var(--spacing-xs); list-style: none; }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: clamp(8px, 1.2vh, 12px) var(--spacing-sm);
            border-radius: 8px;
            font-size: clamp(0.85rem, 0.95em, 1.05rem);
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .sidebar-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .sidebar-item.active { background-color: var(--bg-hover); color: var(--text-main); font-weight: 600; }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .upgrade-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: clamp(8px, 1.5vh, 12px);
            border-radius: 8px;
            font-size: clamp(0.8rem, 0.9em, 1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upgrade-btn:hover { background-color: var(--bg-hover); border-color: #3f3f46; }

        .footer-bottom-row { display: flex; align-items: center; justify-content: space-between; }
        .profile-box { display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; padding: var(--spacing-xs); border-radius: 8px; transition: background-color 0.2s; }
        .profile-box:hover { background-color: var(--bg-hover); }

        .avatar-small {
            width: clamp(26px, 2rem, 32px);
            height: clamp(26px, 2rem, 32px);
            background-color: #3f3f46;
            color: #f4f4f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 0.8em, 0.95rem);
            font-weight: 600;
        }
        .profile-name { font-size: clamp(0.8rem, 0.9em, 1rem); font-weight: 500; color: var(--text-main); }

        .icon-btn-subtle {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: clamp(28px, 2.2rem, 36px);
            height: clamp(28px, 2.2rem, 36px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn-subtle:hover { background-color: var(--bg-hover); color: var(--text-main); }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 998; backdrop-filter: blur(2px); }
        #overlay.show { display: block; }

        /* ==========================================================================
           Main Layout & Header (메인 레이아웃 및 상단바)
           ========================================================================== */
        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; background-color: var(--bg-dark); min-width: 0; height: 100dvh; }

        #top-bar {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-md);
            background: var(--bg-dark);
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .top-left { display: flex; align-items: center; gap: var(--spacing-sm); }

        .model-selector {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: clamp(0.75rem, 0.85em, 0.95rem);
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding: clamp(4px, 0.8vh, 8px) var(--spacing-md);
            border-radius: 8px;
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .model-selector:hover { color: var(--text-main); border-color: #3f3f46; }
        .model-selector span { font-weight: 600; color: var(--text-main); }

        /* ==========================================================================
           Chat Area (채팅 영역)
           ========================================================================== */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            scroll-behavior: smooth;
        }
        #chat-box.chat-active { justify-content: flex-start; text-align: left; }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-lg);
            width: 100%;
            max-width: var(--chat-max-width);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-title {
            font-size: clamp(1.2rem, 2.2vw + 0.8vh, 1.8rem);
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            letter-spacing: -0.02em;
        }

        /* 반응형 검색 및 입력창 */
        .center-search-box {
            width: 100%;
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: clamp(10px, 1.5vw, 16px);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .center-search-box:focus-within {
            border-color: #52525b;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
        }

        #preview-container { display: none; align-items: center; gap: var(--spacing-sm); padding-bottom: var(--spacing-xs); border-bottom: 1px solid var(--border-color); }
        .file-preview-card {
            padding: clamp(4px, 0.6vh, 8px) var(--spacing-sm);
            border-radius: 6px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: clamp(0.75rem, 0.85em, 0.9rem);
            color: var(--text-muted);
        }
        .remove-file-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            padding: 2px;
        }
        .remove-file-btn:hover { color: #fff; background-color: var(--bg-hover); }

        .search-bottom-row { display: flex; align-items: center; gap: var(--spacing-sm); width: 100%; }
        .center-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: clamp(0.9rem, 1em, 1.1rem);
            color: var(--text-main);
            min-width: 50px;
        }
        .center-input::placeholder { color: #52525b; }

        .send-btn {
            background-color: var(--text-main);
            color: var(--bg-dark);
            width: clamp(30px, 2.2rem, 40px);
            height: clamp(30px, 2.2rem, 40px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:active { transform: scale(0.95); }

        /* 대화 메시지 영역 */
        .msg-container { width: 100%; max-width: var(--chat-max-width); display: flex; flex-direction: column; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
        .msg-wrapper { width: 100%; display: flex; align-items: flex-start; gap: var(--spacing-md); animation: msgFade 0.25s ease forwards; }

        @keyframes msgFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.user { justify-content: flex-end; }

        .chat-avatar {
            width: clamp(28px, 2.2rem, 36px);
            height: clamp(28px, 2.2rem, 36px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            font-size: clamp(0.75rem, 0.85em, 1rem);
        }
        .user-avatar { background-color: var(--bg-card); color: var(--text-main); }
        .ai-avatar { background-color: var(--accent-color); color: #fff; border: none; }

        .message {
            line-height: 1.7;
            font-size: clamp(0.85rem, 0.95em, 1.05rem);
            max-width: calc(100% - 48px);
            word-break: break-word;
        }
        .user-msg {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 12px;
            white-space: pre-wrap;
        }
        .ai-msg { color: #e4e4e7; width: 100%; }

        /* 마크다운 반응형 요소 */
        .ai-msg h1, .ai-msg h2, .ai-msg h3 { margin: var(--spacing-md) 0 var(--spacing-xs) 0; font-weight: 600; color: #fff; }
        .ai-msg h1 { font-size: clamp(1.2rem, 1.4em, 1.6rem); }
        .ai-msg h2 { font-size: clamp(1.05rem, 1.2em, 1.35rem); }
        .ai-msg h3 { font-size: clamp(0.95rem, 1.05em, 1.15rem); }
        .ai-msg p { margin-bottom: var(--spacing-sm); }
        .ai-msg ul, .ai-msg ol { padding-left: 1.5rem; margin-bottom: var(--spacing-sm); }
        .ai-msg li { margin-bottom: 0.25rem; }
        .ai-msg strong { color: #fff; font-weight: 600; }
        .ai-msg code:not(pre code) {
            background-color: var(--bg-card);
            color: #a78bfa;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            border: 1px solid var(--border-color);
        }

        /* 반응형 코드 블록 */
        .code-block-wrapper {
            background-color: #121215;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: var(--spacing-md) 0;
            overflow: hidden;
        }
        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #18181b;
            padding: var(--spacing-xs) var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            font-size: clamp(0.7rem, 0.8em, 0.85rem);
            color: var(--text-muted);
            font-family: monospace;
        }
        .code-lang { font-weight: 600; text-transform: uppercase; color: #a78bfa; }
        .code-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(0.65rem, 0.75em, 0.8rem);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .code-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .code-block-wrapper pre { padding: var(--spacing-md); overflow-x: auto; margin: 0; background-color: transparent; }
        .code-block-wrapper code { font-family: "Fira Code", Monaco, Consolas, monospace; font-size: clamp(0.8rem, 0.9em, 0.95rem); line-height: 1.5; }

        /* 로딩 애니메이션 */
        .ai-thinking-indicator { display: flex; align-items: center; gap: var(--spacing-sm); color: var(--text-muted); font-size: clamp(0.85rem, 0.9em, 1rem); }
        .thinking-dot {
            width: clamp(6px, 0.8em, 10px);
            height: clamp(6px, 0.8em, 10px);
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }

        /* 반응형 모달 */
        #model-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 12px; padding: var(--spacing-lg); width: min(420px, 90vw); display: flex; flex-direction: column; gap: var(--spacing-md); }
        .modal-title { font-size: clamp(0.95rem, 1.1em, 1.2rem); font-weight: 600; color: var(--text-main); }
        .modal-input { width: 100%; padding: var(--spacing-sm) var(--spacing-md); background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: clamp(0.85rem, 0.9em, 1rem); outline: none; }
        .modal-input:focus { border-color: #52525b; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: var(--spacing-xs); }
        .modal-btn { padding: var(--spacing-xs) var(--spacing-md); border-radius: 6px; font-size: clamp(0.8rem, 0.85em, 0.95rem); font-weight: 500; cursor: pointer; border: none; }
        .modal-btn.cancel { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); }
        .modal-btn.confirm { background: var(--text-main); color: var(--bg-dark); }

        #file-input { display: none; }

        /* ==========================================================================
           화면 비율 및 반응형 브레이크포인트 (Aspect Ratio & Device Adaptations)
           ========================================================================== */
        /* 모바일 기기 (768px 이하) */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: clamp(240px, 75vw, 300px);
                transform: translateX(-100%);
            }
            #sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .close-sidebar-btn { display: block; }
        }

        /* 세로 모드 (Portrait, 얇은 화면 비율) */
        @media (max-aspect-ratio: 4/3) {
            :root {
                --chat-max-width: 96vw;
            }
            .welcome-title { font-size: clamp(1.1rem, 4vw, 1.5rem); }
        }

        /* 울트라 와이드 및 대형 모니터 (Landscape) */
        @media (min-aspect-ratio: 21/9) {
            :root {
                font-size: 16px;
                --chat-max-width: 1000px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- 모델 변경 모달 -->
    <div id="model-modal">
        <div class="modal-content">
            <div class="modal-title">OpenRouter 모델 선택</div>
            <p style="font-size: 0.85em; color: var(--text-muted); line-height: 1.4;">
                사용할 OpenRouter 모델 식별자(ID)를 입력하세요.<br>
                기본 지정: <code>openrouter/free</code>
            </p>
            <input type="text" id="model-input-field" class="modal-input" value="openrouter/free">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModelModal()">취소</button>
                <button class="modal-btn confirm" onclick="saveModelSelection()">적용</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" onchange="handleFileSelect(event)">

    <!-- 사이드바 -->
    <aside id="sidebar">
        <div>
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
                    </div>
                    Code Jun
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="#" class="sidebar-item active" onclick="resetToHome()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        새 대화 시작
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="sidebar-footer">
            <button class="upgrade-btn" onclick="alert('PRO 플랜 준비 중입니다.')">
                <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                Pro 업그레이드
            </button>
            <div class="footer-bottom-row">
                <div class="profile-box">
                    <div class="avatar-small">준</div>
                    <span class="profile-name">신준호</span>
                </div>
                <button class="icon-btn-subtle" onclick="alert('설정 메뉴입니다.')" title="설정">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- 메인 컨텐츠 -->
    <main id="main-content">
        <header id="top-bar">
            <div class="top-left">
                <button class="icon-btn-subtle" onclick="toggleSidebar()" title="사이드바 열기">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="model-selector" onclick="openModelModal()">
                    <span>모델:</span>
                    <span id="current-model-display">openrouter/free</span>
                    <svg class="svg-icon" style="width:12px; height:12px;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>
            <div class="top-right">
                <button class="icon-btn-subtle" onclick="resetToHome()" title="새 채팅">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
            </div>
        </header>

        <div id="chat-box">
            <div id="welcome-view" class="welcome-container">
                <h1 class="welcome-title" id="coding-quote">무엇을 도와드릴까요?</h1>
                
                <div class="center-search-box">
                    <div id="preview-container">
                        <div class="file-preview-card" id="preview-card-box">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                            <span id="preview-filename">파일</span>
                            <button class="remove-file-btn" onclick="removeFile()">
                                <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>

                    <div class="search-bottom-row">
                        <button class="icon-btn-subtle" onclick="triggerFileUpload()" title="파일 첨부">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <input type="text" id="user-input" class="center-input" placeholder="코드 작성, 버그 수정, 알고리즘 질문..." onkeypress="handleEnter(event)">
                        <button class="send-btn" onclick="handleSendButton()" title="전송">
                            <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
    let currentSelectedModel = "openrouter/free";
    let isChatStarted = false;
    let attachedFile = null;
    let isGenerating = false;
    let abortController = null;
    let currentThinkingId = null;

    let conversationHistory = [
        { role: "system", content: "You are Code Jun, a precise, expert software engineering assistant." }
    ];

    const codingQuotes = [
        "Talk is cheap. Show me the code.",
        "Premature optimization is the root of all evil.",
        "Simplicity is prerequisite for reliability."
    ];

    window.onload = function() {
        document.getElementById("coding-quote").innerText = codingQuotes[Math.floor(Math.random() * codingQuotes.length)];
    };

    // 커스텀 마크다운 코드 블록 렌더러
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
        const lang = language || 'code';
        return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span class="code-lang">${lang}</span>
                    <button class="code-btn" onclick="copyCode(this)">
                        <svg class="svg-icon" style="width:12px; height:12px;" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        복사
                    </button>
                </div>
                <pre><code class="hljs language-${lang}">${code}</code></pre>
            </div>
        `;
    };
    marked.setOptions({ renderer: renderer, breaks: true });

    function copyCode(btn) {
        const wrapper = btn.closest('.code-block-wrapper');
        const codeText = wrapper.querySelector('code').innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            btn.innerHTML = `<svg class="svg-icon" style="width:12px; height:12px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> 완료`;
            setTimeout(() => {
                btn.innerHTML = `<svg class="svg-icon" style="width:12px; height:12px;" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 복사`;
            }, 2000);
        });
    }

    function openModelModal() { document.getElementById("model-modal").style.display = "flex"; }
    function closeModelModal() { document.getElementById("model-modal").style.display = "none"; }
    function saveModelSelection() {
        const val = document.getElementById("model-input-field").value.trim();
        if (val) {
            currentSelectedModel = val;
            document.getElementById("current-model-display").innerText = val;
        }
        closeModelModal();
    }

    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle("open");
            overlay.classList.toggle("show");
        } else {
            sidebar.style.transform = sidebar.style.transform === "translateX(-100%)" ? "translateX(0)" : "translateX(-100%)";
        }
    }

    function resetToHome() {
        if (isGenerating && abortController) abortController.abort();
        isChatStarted = false;
        attachedFile = null;
        conversationHistory = [{ role: "system", content: "You are Code Jun, a precise, expert software engineering assistant." }];
        const chatBox = document.getElementById("chat-box");
        chatBox.classList.remove("chat-active");
        chatBox.innerHTML = `
            <div id="welcome-view" class="welcome-container">
                <h1 class="welcome-title">${codingQuotes[Math.floor(Math.random() * codingQuotes.length)]}</h1>
                <div class="center-search-box">
                    <div id="preview-container" style="display: none;"></div>
                    <div class="search-bottom-row">
                        <button class="icon-btn-subtle" onclick="triggerFileUpload()" title="파일 첨부">
                            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <input type="text" id="user-input" class="center-input" placeholder="코드 작성, 버그 수정, 알고리즘 질문..." onkeypress="handleEnter(event)">
                        <button class="send-btn" onclick="handleSendButton()" title="전송">
                            <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>`;
    }

    function triggerFileUpload() { document.getElementById("file-input").click(); }
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            attachedFile = file;
            const previewContainer = document.getElementById("preview-container");
            if(previewContainer) {
                previewContainer.style.display = "flex";
                document.getElementById("preview-filename").innerText = file.name;
            }
        }
    }
    function removeFile() {
        attachedFile = null;
        document.getElementById("file-input").value = "";
        const previewContainer = document.getElementById("preview-container");
        if(previewContainer) previewContainer.style.display = "none";
    }

    function readFileContent(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            if (file.type.startsWith('image/')) reader.readAsDataURL(file);
            else reader.readAsText(file);
        });
    }

    function handleSendButton() { if (isGenerating) { abortController?.abort(); } else { sendMessage(); } }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        if (!inputField) return;
        const message = inputField.value.trim();
        if (message === "" && !attachedFile) return;

        const chatBox = document.getElementById("chat-box");
        if (!isChatStarted) {
            isChatStarted = true;
            chatBox.classList.add("chat-active");
            chatBox.innerHTML = `
                <div id="msg-container" class="msg-container"></div>
                <div style="width: 100%; max-width: var(--chat-max-width); margin-top: auto; padding-top: var(--spacing-xs);">
                    <div class="center-search-box">
                        <div id="preview-container" style="display: none;"></div>
                        <div class="search-bottom-row">
                            <button class="icon-btn-subtle" onclick="triggerFileUpload()" title="파일 첨부">
                                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            </button>
                            <input type="text" id="user-input" class="center-input" placeholder="메시지 입력..." onkeypress="handleEnter(event)">
                            <button class="send-btn" onclick="handleSendButton()">
                                <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        const msgContainer = document.getElementById("msg-container");
        let displayMsg = message;
        let filePayload = null;
        
        if (attachedFile) {
            displayMsg = `[첨부: ${attachedFile.name}]\n` + message;
            filePayload = { name: attachedFile.name, type: attachedFile.type || 'text/plain', content: await readFileContent(attachedFile) };
        }

        appendMessage(displayMsg, "user", msgContainer);
        removeFile();
        inputField.value = "";

        let fullUserMessage = message;
        if (filePayload) {
            if (filePayload.type.startsWith('image/')) {
                fullUserMessage = [{ type: "text", text: message || "이미지 분석" }, { type: "image_url", image_url: { url: filePayload.content } }];
            } else {
                fullUserMessage = `[파일명: ${filePayload.name}]\n\`\`\`\n${filePayload.content}\n\`\`\`\n${message}`;
            }
        }

        conversationHistory.push({ role: "user", content: fullUserMessage });

        currentThinkingId = "thinking-" + Date.now();
        appendMessage(`<div class="ai-thinking-indicator"><div class="thinking-dot"></div><span>답변 생성 중...</span></div>`, "ai", msgContainer, currentThinkingId, true);

        isGenerating = true;
        abortController = new AbortController();

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model: currentSelectedModel, messages: conversationHistory }),
                signal: abortController.signal
            });

            const data = await response.json();
            document.getElementById(currentThinkingId)?.remove();

            if (!response.ok) {
                appendMessage(`[오류] ${data.error || "응답 처리 오류"}`, "ai", msgContainer);
                return;
            }

            if (data.reply) {
                conversationHistory.push({ role: "assistant", content: data.reply });
                appendMessage(data.reply, "ai", msgContainer);
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            document.getElementById(currentThinkingId)?.remove();
            appendMessage(`[시스템 오류] ${error.message}`, "ai", msgContainer);
        } finally {
            isGenerating = false;
            abortController = null;
        }
    }

    function appendMessage(text, sender, container, id = null, isHtml = false) {
        const wrapper = document.createElement("div");
        wrapper.className = `msg-wrapper ${sender}`;
        if (id) wrapper.id = id;

        const avatar = document.createElement("div");
        avatar.className = `chat-avatar ${sender}-avatar`;
        avatar.innerHTML = sender === 'ai' 
            ? `<svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>` 
            : `준`;

        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-msg`;
        
        if (isHtml) {
            msgDiv.innerHTML = text;
        } else {
            if (sender === 'ai') {
                msgDiv.innerHTML = marked.parse(String(text));
                msgDiv.querySelectorAll('pre code').forEach((block) => {
                    try { hljs.highlightElement(block); } catch(e){}
                });
            } else {
                msgDiv.innerHTML = String(text).replace(/\n/g, "<br>");
            }
        }

        if (sender === 'ai') {
            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
        } else {
            wrapper.appendChild(msgDiv);
            wrapper.appendChild(avatar);
        }
        
        container.appendChild(wrapper);
        const chatBox = document.getElementById("chat-box");
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    function handleEnter(event) { if (event.key === "Enter") handleSendButton(); }
</script>
</body>
</html>
